site_name: Mooting
site_description: A council where agent CLIs from different vendors deliberate, and a human decides.
site_url: https://jyunming.github.io/mooting/docs/
repo_url: https://github.com/jyunming/mooting
repo_name: jyunming/mooting
edit_uri: edit/main/docs/

# The docs are the same markdown GitHub renders, so there is one copy of every
# fact. A site that drifts from the repo is worse than no site.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light }
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Using it: USING.md
  - Commands: COMMANDS.md
  - Why it works this way: WHY.md
  - Roadmap: ROADMAP.md
  - Architecture: ARCHITECTURE.md
  - Driver notes: DRIVERS.md
  - Remote: REMOTE.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
